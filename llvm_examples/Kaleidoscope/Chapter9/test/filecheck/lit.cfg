import os
import subprocess

import lit.formats

config.name = 'Kaleidoscope'
config.test_format = lit.formats.ShTest(True)
config.suffixes = ['.k']
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.environ.get(
    'LIT_EXEC_ROOT', os.path.join(config.test_source_root, 'Output'))

# The toy binary: set by ctest via TOY_BIN, defaults to ../../build/toy
toy = os.environ.get(
    'TOY_BIN',
    os.path.normpath(os.path.join(config.test_source_root, '..', '..', 'build', 'toy')))
config.substitutions.append(('%toy', toy))

# Put FileCheck (from llvm-config --bindir) on PATH
path = os.environ.get('PATH', '')
try:
    bindir = subprocess.check_output(['llvm-config', '--bindir'],
                                     text=True).strip()
    path = bindir + os.pathsep + path
except Exception:
    pass
config.environment['PATH'] = path
